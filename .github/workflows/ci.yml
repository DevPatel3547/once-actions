name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[mcp,dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -v
      - run: python -m build
      - name: Install wheel outside checkout
        run: |
          python -m venv /tmp/once-wheel
          /tmp/once-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/once-wheel/bin/once-actions --help
          /tmp/once-wheel/bin/python -c "from once_actions.server import ASSETS; assert (ASSETS / 'studio.html').is_file()"
